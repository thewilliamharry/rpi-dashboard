name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --project dashboard --frozen
      - run: uv run --project dashboard --frozen python -m pytest -q
      - run: uv run --project dashboard --frozen pip-audit

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: dashboard
          load: true
          tags: beacon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: beacon:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  arm64-runtime:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: dashboard
          load: true
          tags: beacon:arm64-ci
      - name: Verify non-root, read-only Chromium sandbox
        run: >-
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m
          --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 256
          beacon:arm64-ci python runtime_smoke.py
