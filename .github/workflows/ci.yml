name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --project dashboard --frozen
      - run: uv run --project dashboard --frozen python -m pytest -q
      - run: uv run --project dashboard --frozen pip-audit

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: dashboard
          load: true
          tags: beacon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify legacy volume migration and Compose health
        run: |
          set -eux
          docker tag beacon:ci beacon:2.0.1
          trap 'docker compose -p beacon-ci down -v --remove-orphans || true' EXIT
          docker compose -p beacon-ci run --rm --no-deps --user 0:0 data-init \
            python -c "import os,sqlite3; os.chown('/data',0,0); c=sqlite3.connect('/data/dashboard.db'); c.execute('create table sentinel(value text)'); c.execute(\"insert into sentinel values('preserved')\"); c.commit(); c.close(); os.chown('/data/dashboard.db',0,0)"
          docker compose -p beacon-ci run --rm --no-deps data-init
          docker compose -p beacon-ci run --rm --no-deps --user 10001:10001 data-init \
            python -c "import os,sqlite3; import app; app.update_worker_heartbeat(); c=sqlite3.connect('/data/dashboard.db'); assert c.execute('select value from sentinel').fetchone()[0] == 'preserved'; assert os.stat('/data/dashboard.db').st_uid == 10001"
          docker compose -p beacon-ci up -d --no-build --force-recreate --remove-orphans --wait --wait-timeout 180
          init_id="$(docker compose -p beacon-ci ps --all -q data-init)"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$init_id")" = "0"
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$init_id")" = "none"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$init_id")" = "true"
          test "$(docker inspect --format '{{json .HostConfig.CapDrop}}' "$init_id")" = '["ALL"]'
          test "$(docker inspect --format '{{json .HostConfig.CapAdd}}' "$init_id")" = '["CHOWN"]'
          curl --fail http://127.0.0.1/healthz
          curl --fail http://127.0.0.1/readyz
          docker compose -p beacon-ci exec -T worker \
            python -c "import sqlite3; c=sqlite3.connect('/data/dashboard.db'); assert c.execute('select value from sentinel').fetchone()[0] == 'preserved'"
          docker compose -p beacon-ci up -d --no-build --force-recreate --remove-orphans --wait --wait-timeout 180
          docker compose -p beacon-ci exec -T worker \
            python -c "import sqlite3; c=sqlite3.connect('/data/dashboard.db'); assert c.execute('select value from sentinel').fetchone()[0] == 'preserved'"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: beacon:ci
          version: v0.70.0
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  arm64-runtime:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: dashboard
          load: true
          tags: beacon:arm64-ci
      - name: Verify non-root, read-only Chromium sandbox
        run: >-
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m
          --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 256
          beacon:arm64-ci python runtime_smoke.py
