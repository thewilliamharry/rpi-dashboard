<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Beacon</title>
  <link rel="icon" id="favicon" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" id="apple-favicon" sizes="180x180">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="grid-overlay" aria-hidden="true"></div>
  <div class="scanline" aria-hidden="true"></div>
  <div class="hud-c tl" aria-hidden="true"></div><div class="hud-c tr" aria-hidden="true"></div>
  <div class="hud-c bl" aria-hidden="true"></div><div class="hud-c br" aria-hidden="true"></div>

  <header class="topbar">
    <div class="tb-left">
      <span class="tb-host" id="tb-host">loading...</span><div class="tb-sep"></div>
      <div class="scan-status" role="status"><span class="scan-pip" id="scan-pip"></span><span id="scan-label">connecting</span></div>
    </div>
    <div class="tb-right">
      <button type="button" class="btn-scan">↻ scan now</button><div class="tb-sep"></div>
      <button type="button" class="theme-toggle" id="toggle" aria-label="Switch color theme" aria-pressed="false"><span class="toggle-pip"></span></button>
    </div>
  </header>

  <div class="connection-banner" id="connection-banner" role="alert" hidden>Beacon is disconnected. Displayed data may be stale.</div>

  <main class="page">
    <section aria-labelledby="system-heading">
      <div class="sh"><h1 class="sh-label" id="system-heading">System</h1><div class="sh-line"></div><span class="sh-r" id="stats-ts">—</span></div>
      <div class="metrics-row">
        <article class="metric-panel cpu">
          <div class="arc-wrap"><svg viewBox="0 0 84 84" aria-hidden="true"><circle class="arc-track" cx="42" cy="42" r="34" stroke-dasharray="214" stroke-dashoffset="53"></circle><circle class="arc-fill" cx="42" cy="42" r="34" stroke-dasharray="214" stroke-dashoffset="213.6" id="cpu-arc"></circle></svg><div class="arc-center"><span class="arc-pct" id="cpu-pct">—</span><span class="arc-unit">%</span></div></div>
          <div class="metric-right"><span class="metric-name">CPU</span><div class="sparkline"><svg viewBox="0 0 200 40" preserveAspectRatio="none"><path class="sp-fill" id="cpu-sparkfill"></path><path class="sp-line" id="cpu-sparkline"></path></svg></div></div>
        </article>
        <article class="metric-panel ram">
          <div class="arc-wrap"><svg viewBox="0 0 84 84" aria-hidden="true"><circle class="arc-track" cx="42" cy="42" r="34" stroke-dasharray="214" stroke-dashoffset="53"></circle><circle class="arc-fill" cx="42" cy="42" r="34" stroke-dasharray="214" stroke-dashoffset="213.6" id="ram-arc"></circle></svg><div class="arc-center"><span class="arc-pct" id="ram-pct">—</span><span class="arc-unit">%</span></div></div>
          <div class="metric-right"><span class="metric-name">RAM</span><span class="metric-sub" id="ram-sub">—</span><div class="sparkline"><svg viewBox="0 0 200 40" preserveAspectRatio="none"><path class="sp-fill" id="ram-sparkfill"></path><path class="sp-line" id="ram-sparkline"></path></svg></div></div>
        </article>
        <article class="metric-panel disk">
          <div class="arc-wrap"><svg viewBox="0 0 84 84" aria-hidden="true"><circle class="arc-track" cx="42" cy="42" r="34" stroke-dasharray="214" stroke-dashoffset="53"></circle><circle class="arc-fill" cx="42" cy="42" r="34" stroke-dasharray="214" stroke-dashoffset="213.6" id="disk-arc"></circle></svg><div class="arc-center"><span class="arc-pct" id="disk-pct">—</span><span class="arc-unit">%</span></div></div>
          <div class="metric-right"><span class="metric-name">Disk</span><span class="metric-sub" id="disk-sub">—</span><div class="sparkline"><svg viewBox="0 0 200 40" preserveAspectRatio="none"><path class="sp-fill" id="disk-sparkfill"></path><path class="sp-line" id="disk-sparkline"></path></svg></div></div>
        </article>
      </div>
      <div class="temp-row"><span>CPU TEMP</span><span class="temp-val" id="temp-val">—</span></div>
    </section>

    <section aria-labelledby="services-heading">
      <div class="sh"><h2 class="sh-label" id="services-heading">Services</h2><div class="sh-line"></div><span class="sh-r" id="svc-count-label">—</span></div>
      <div class="services-grid" id="services-grid"><div class="svc-empty">waiting for worker…</div></div>
    </section>

    <section aria-labelledby="events-heading">
      <div class="sh"><h2 class="sh-label" id="events-heading">Events</h2><div class="sh-line"></div><span class="sh-r" id="events-label">—</span></div>
      <div class="events-panel" id="events-panel"><div class="evt-empty">no recent incidents</div></div>
    </section>
  </main>

  <div class="meta-modal-backdrop" id="meta-modal" hidden>
    <div class="meta-modal-window" role="dialog" aria-modal="true" aria-labelledby="meta-modal-title">
      <div class="meta-modal-head"><h2 id="meta-modal-title">Edit Service</h2><span class="meta-modal-port" id="meta-modal-port">:—</span></div>
      <form id="meta-form" class="meta-form">
        <label class="meta-field"><span class="meta-label">Display name</span><input type="text" id="meta-display-name" autocomplete="off"></label>
        <label class="meta-field"><span class="meta-label">Path</span><input type="text" id="meta-path" placeholder="/" autocomplete="off"><span class="meta-help">Used for checks, previews, and the link.</span></label>
        <label class="meta-field meta-checkbox"><input type="checkbox" id="meta-critical"><span>Critical service</span></label>
        <label class="meta-field"><span class="meta-label">Tags</span><input type="text" id="meta-tags" placeholder="core, prod" autocomplete="off"></label>
        <details class="meta-advanced" id="meta-advanced"><summary>Advanced</summary>
          <label class="meta-field"><span class="meta-label">Base URL</span><input type="text" id="meta-url" placeholder="http://raspi.local:8100" autocomplete="off"><span class="meta-help">Must target this Pi or an approved alias.</span></label>
          <label class="meta-field"><span class="meta-label">Healthy HTTP statuses</span><input type="text" id="meta-healthy-statuses" placeholder="200-399" autocomplete="off"><span class="meta-help">Comma-separated codes or ranges.</span></label>
        </details>
        <div class="meta-error" id="meta-error" hidden></div>
        <div class="meta-actions"><button type="button" class="meta-btn meta-btn-ghost" id="meta-cancel">Cancel</button><button type="submit" class="meta-btn meta-btn-primary" id="meta-save">Save</button></div>
      </form>
    </div>
  </div>
</body>
</html>
