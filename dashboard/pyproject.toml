[project]
name = "beacon-dashboard"
version = "2.0.1"
description = "Self-contained Raspberry Pi service and system dashboard"
requires-python = ">=3.11,<3.13"
dependencies = [
  "APScheduler==3.11.3",
  "beautifulsoup4==4.15.0",
  "Flask==3.1.3",
  "gunicorn==26.0.0",
  "playwright==1.62.0",
  "psutil==7.2.2",
  "requests==2.34.2",
  "tzdata==2026.3",
  "urllib3==2.7.0",
]

[dependency-groups]
dev = [
  "pip-audit==2.10.1",
  "pytest>=9.0.2,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["../tests"]
