x-beacon-common: &beacon-common
  image: beacon:2.0.1
  restart: unless-stopped
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001
  volumes:
    - dashboard-data:/data
  environment: &beacon-environment
    EXPIRE_DAYS: "7"
    METRIC_SAMPLE_SECONDS: "5"
    METRIC_HISTORY_SECONDS: "60"
    WORKER_READY_SECONDS: "20"
    DISCOVERY_TIMEOUT_SECONDS: "180"
    EXTRA_SCAN_PORTS: "8100"
    TRUSTED_HOSTS: "${BEACON_TRUSTED_HOSTS:-raspi.local,localhost,127.0.0.1,::1}"
    LOCAL_SERVICE_HOSTS: "${BEACON_LOCAL_SERVICE_HOSTS:-raspi.local}"
    TRIGGER_SCAN_RATE_LIMIT: "4"
    TRIGGER_SCAN_WINDOW_SECONDS: "60"
    ALERT_WEBHOOK_URL: ""
    ALERT_COOLDOWN_SECONDS: "300"
    ALERT_ONLY_CRITICAL: "0"
    ENABLE_PROMETHEUS: "0"

services:
  data-init:
    build: ./dashboard
    image: beacon:2.0.1
    user: "0:0"
    command: ["chown", "-R", "10001:10001", "/data"]
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    volumes:
      - dashboard-data:/data

  worker:
    <<: *beacon-common
    container_name: beacon-worker
    command: ["python", "worker.py"]
    network_mode: host
    mem_limit: 1g
    pids_limit: 256
    shm_size: 256m
    depends_on:
      data-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import json,sqlite3,time; c=sqlite3.connect('/data/dashboard.db'); r=c.execute(\"select value from runtime_state where key='worker_heartbeat'\").fetchone(); assert r and time.time()-json.loads(r[0])['ts'] < 20"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    <<: *beacon-common
    container_name: beacon-web
    ports:
      - "80:8080"
    mem_limit: 256m
    pids_limit: 128
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status == 200"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dashboard-data:
